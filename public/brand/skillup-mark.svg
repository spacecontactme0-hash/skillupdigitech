<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SkillUp Growth Mark">
  <defs>
    <linearGradient id="skillup-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B69" />
      <stop offset="55%" stop-color="#231651" />
      <stop offset="100%" stop-color="#150C33" />
    </linearGradient>
    <linearGradient id="skillup-step-mid" x1="16" y1="36" x2="48" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A6E8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skillup-bg)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#613399" stroke-opacity="0.55" stroke-width="1.5" />

