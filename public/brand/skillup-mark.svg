  <!-- Upper Summit Bar -->
  <rect x="24" y="14.5" width="20" height="8.5" rx="4.25" fill="#FFFFFF" />
  <!-- Luminous Mint Apex Growth Node -->
  <circle cx="48.5" cy="18.75" r="5" fill="#D6FFF6" />
  <circle cx="48.5" cy="18.75" r="2.1" fill="#0A5C4A" />
